server {
    listen 80;
    client_max_body_size 64M;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Static files — serve langsung
    location /logo/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /uploads/ {
        # File di-mount dari volume bersama backend
        expires 7d;
        add_header Cache-Control "public";
    }

    # Data JSON — proxy ke backend
    location /data/ {
        proxy_pass http://backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API + Admin — proxy ke backend
    location ~ ^/(api_|update_|admin|login|logout|index\.php) {
        proxy_pass http://backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — semua request lain ke index.html
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache";
    }
}
